name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ROS2 package and launch files are only syntax-checked here: the CI
      # runner has no ROS2 / Gazebo installation.  See docs/ros2_integration.md.
      - name: Compile-check all Python (offline sim + ROS2 nodes + launch files)
        run: |
          python -m compileall -q navfollow tests tools ros2_ws
          echo "py_compile OK"

      - name: Unit tests (55 tests)
        run: python -m pytest -q

      - name: Quick evaluation (6 navigation trials + 4 occlusion events)
        run: python -m navfollow.evaluate --quick --no-demos

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          if-no-files-found: error
